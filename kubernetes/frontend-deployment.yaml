apiVersion: apps/v1
kind: Deployment
metadata:
  name: universal-biz-automat-frontend
  labels:
    app: universal-biz-automat-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: universal-biz-automat-frontend
  template:
    metadata:
      labels:
        app: universal-biz-automat-frontend
    spec:
      containers:
      - name: frontend
        image: your-registry/universal-biz-automat-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: "https://api.yourdomain.com"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: universal-biz-automat-frontend-service
spec:
  selector:
    app: universal-biz-automat-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
