name: Deploy to Railway

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.9'
  NODE_VERSION: '18'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: universalbizautomat_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Node.js dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run backend tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/universalbizautomat_test
        FLASK_ENV: testing
        SECRET_KEY: test-secret-key
      run: |
        flask db upgrade
        python -m pytest test_*.py -v || true
    
    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false || true
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build

  deploy-railway:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Railway CLI
      run: npm install -g @railway/cli
    
    - name: Deploy to Railway
      run: |
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        railway up
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    
    - name: Set Environment Variables
      run: |
        railway variables set FLASK_ENV=production
        railway variables set SECRET_KEY=${{ secrets.SECRET_KEY }}
        railway variables set DATABASE_URL=${{ secrets.DATABASE_URL }}
        railway variables set CORS_ORIGINS=${{ secrets.RAILWAY_URL }}
        railway variables set MAIL_SERVER=${{ secrets.MAIL_SERVER }}
        railway variables set MAIL_PORT=${{ secrets.MAIL_PORT }}
        railway variables set MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
        railway variables set MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        RAILWAY_URL: ${{ secrets.RAILWAY_URL }}
        MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
        MAIL_PORT: ${{ secrets.MAIL_PORT }}
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    
    - name: Get Railway URL
      run: |
        echo "Railway URL: $(railway domain)"
        echo "🚀 Deployment completed successfully!"
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-railway-frontend:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Railway CLI
      run: npm install -g @railway/cli
    
    - name: Deploy Frontend to Railway
      run: |
        cd frontend
        railway login --token ${{ secrets.RAILWAY_TOKEN }}
        railway up
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    
    - name: Set Frontend Environment Variables
      run: |
        cd frontend
        railway variables set REACT_APP_API_URL=${{ secrets.RAILWAY_API_URL }}
        railway variables set NODE_ENV=production
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        RAILWAY_API_URL: ${{ secrets.RAILWAY_API_URL }}
